[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcinsight"
version = "0.1.0"
description = "PCInsight - PC hardware and network analyzer for Windows"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.gui-scripts]
pcinsight = "pcinsight.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
